apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-sample
  namespace: cel-demo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cleanup-sample"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-sample
  namespace: cel-demo
subjects:
  - kind: ServiceAccount
    name: kyverno-cleanup-controller
    namespace: kyverno
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanup-sample
