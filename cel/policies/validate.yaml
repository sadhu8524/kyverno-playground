apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: lab-check-log-type
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cel-demo
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        has(object.metadata.labels) && 'log-type' in object.metadata.labels &&
        object.metadata.labels['log-type'] in ['infrastructure', 'application']
      message: "The lab accepts log-type infrastructure or application."
