apiVersion: policies.kyverno.io/v1alpha1
kind: MutatingPolicy
metadata:
  name: lab-default-log-type
spec:
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cel-demo
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: missing-log-type
      expression: "!has(object.metadata.labels) || !('log-type' in object.metadata.labels)"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{metadata: Object.metadata{labels: {"log-type": "infrastructure"}}}
